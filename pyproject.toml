[project]
name = "tg-history-agent"
version = "0.1.0"
description = "AI agent answering questions over a Telegram group's history with links to exact messages"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telethon>=1.36",
    "claude-agent-sdk>=0.2.110",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
